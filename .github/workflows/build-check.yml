name: فحص البناء النظيف

# ─────────────────────────────────────────────────────────────
# بوابة الهجرة (المرحلة B، الخطوة 2) — تجربة جافة بلا نشر ولا كتابة:
#   سحب الحالة الدائمة (قراءة فقط، بلا قفل) ← مسح كل المولَّد ← update_all
#   --generate-only ← تجميع _site ← مقارنة قائمة ملفاته بالموقع الحي.
# يفشل إن وُجد ملف ناقص (موجود بالحي وغائب عن البناء). يُشغَّل يدوياً فقط.
# يرفع تقريراً نصياً (report.txt) لا الموقع.
# ─────────────────────────────────────────────────────────────

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: جلب المستودع
        uses: actions/checkout@v4

      - name: تجهيز بايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: تثبيت المكتبات
        run: python -m pip install --upgrade pip requests pillow cryptography

      - name: سحب الحالة الدائمة (قراءة فقط)
        env:
          DB_KEY: ${{ secrets.DB_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python db_pull.py --ci --no-lock

      - name: مسح المولَّد (شجرة نظيفة)
        run: python clean_generated.py

      - name: توليد فقط (بلا سحب API)
        run: python update_all.py --generate-only

      - name: تجميع _site
        run: python build_site.py --out _site --max-mb 800

      - name: بوابة القوائم (صفر ملفات ناقصة)
        shell: bash
        run: python verify_site.py --site _site --ref HEAD --content --accept live.json 2>&1 | tee report.txt

      - name: رفع التقرير
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-check-report
          path: report.txt
          if-no-files-found: ignore
