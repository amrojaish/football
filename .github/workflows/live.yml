name: النتائج المباشرة

# ⚠️ منفصل عن update-site.yml عمداً:
#    التحديث الكامل يستغرق ~دقيقتين ويعيد توليد 9,000 صفحة.
#    هذا يستغرق ثوانيَ ويكتب ملفاً واحداً (live.json ~0.1 ك.ب)
#    فيمكن تشغيله كل 5 دقائق بلا عبء.
#
# ⚠️ 5 دقائق هو أقل فاصل يسمح به GitHub Actions للجدولة،
#    وحتى هذا غير مضمون بالدقيقة (قد يتأخر عند الازدحام).
#
# ⚠️ الكلفة: طلب API واحد لكل تشغيلة.
#    288 تشغيلة/يوم = 288 طلباً = 4% من حصة 7,500.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# ⚠️ يمنع تداخل تشغيلتين — لو تأخرت واحدة، تُلغى الأقدم
concurrency:
  group: live
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest

    steps:
      - name: جلب المستودع
        uses: actions/checkout@v4

      - name: تجهيز بايثون
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: تثبيت المكتبات
        uses: py-actions/py-pip@v2
        with:
          requirements: requirements.txt

      - name: إنشاء ملف المفتاح
        run: echo "API_KEY=${{ secrets.API_KEY }}" > .env

      - name: سحب المباريات المباشرة
        run: python fetch_live.py

      - name: حذف ملف المفتاح
        run: rm -f .env

      - name: رفع live.json
        run: |
          git config user.name "amrojaish"
          git config user.email "amrojaish@users.noreply.github.com"
          # ⚠️ live.json فقط — لا نلمس football.db ولا الصفحات،
          #    تجنّباً لتعارض مع update-site.yml
          git add live.json
          git diff --cached --quiet && echo "ما في تغيير" && exit 0
          git commit -m "تحديث النتائج المباشرة"
          # ⚠️ إعادة المحاولة: قد تكون الأتمتة الكاملة رفعت
          #    أثناء عملنا، فنسحب ونعيد المحاولة بدل الفشل
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          echo "فشل الرفع بعد 3 محاولات"
          exit 1
