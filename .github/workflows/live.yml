name: Live Scores

# -------------------------------------------------------------
# Fetches in-play matches and writes live.json only.
#
# Separate from update-site.yml on purpose:
#   the full update takes ~2 minutes and regenerates 9,000 pages.
#   this takes seconds and writes one file (live.json ~0.1 KB)
#   so it can run every 5 minutes with no load.
#
# 5 minutes is the shortest interval GitHub Actions allows,
#   and even that is not guaranteed to the minute.
#
# Cost: one API request per run.
#   288 runs/day = 288 requests = 4% of the 7,500 quota.
#
# Same environment as update-site.yml (python 3.12, requests)
#   - there is no requirements.txt in this project.
#
# ASCII only on purpose: Arabic text in this file kept getting
#   corrupted by Windows editors and broke the YAML parser.
# -------------------------------------------------------------

on:
  # Scheduled trigger removed 2026-09-06.
  # This workflow has been permanently disabled since 2026-09-03
  # (see README, lesson 8), but the GitHub "Disable workflow" UI
  # toggle is not visible anywhere in code: anyone who clicks
  # "Enable workflow" on the repo page would silently reinstate
  # 288 API requests/day writing live.json, a file nothing reads.
  # Removing the schedule trigger here makes the disable structural
  # instead of relying on that UI toggle - re-enabling it alone can
  # no longer bring back automatic runs. workflow_dispatch is kept
  # so this can still be run manually if ever needed for debugging.
  workflow_dispatch:

# Prevents two overlapping runs - if one is late, cancel the older
concurrency:
  group: live
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Create env file
        env:
          KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "API key missing from repository secrets"
            exit 1
          fi
          echo "API_FOOTBALL_KEY=$KEY" > .env

      - name: Fetch live matches
        run: python fetch_live.py

      - name: Remove env file
        if: always()
        run: rm -f .env

      - name: Push live.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # live.json only - do not touch football.db or the pages,
          # to avoid conflicts with update-site.yml
          git add live.json

          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "live scores update"

          # Retry: the full automation may have pushed while we worked
          for i in 1 2 3; do
            if git push; then
              echo "Pushed"
              exit 0
            fi
            echo "Push failed - attempt $i"
            git pull --rebase --autostash || true
            sleep 5
          done

          echo "Push failed after 3 attempts"
          exit 1
