# Mirrors the deployed saffara-live worker (read from the Cloudflare API, 2026-10-05).
# Secrets are NOT here: API_KEY lives in Cloudflare (`wrangler secret put API_KEY`).
name = "saffara-live"
main = "worker.js"
compatibility_date = "2026-09-02"
workers_dev = true
preview_urls = false

[vars]
VAPID_PUBLIC_KEY = "BDKf-RdLEGriZoA4wbJfeTyrKwTe42KMNS66HNjG7YVV4V0SIzIWFGPBFMz9g7ppyjsbrQySvnI_49nS3emx-7w"
VAPID_SUBJECT = "https://saffara.app"
# مفتاح إيقاف إرسال إشعارات الأهداف: أي قيمة غير "on" = تسجيل الأحداث فقط بلا إرسال
GOAL_PUSH = "on"

[triggers]
crons = ["*/1 * * * *"]

[[kv_namespaces]]
binding = "LIVE_KV"
id = "cb064fe8ee434e13b6732c2ca96ff01b"

[observability]
enabled = true
head_sampling_rate = 1

# Goal alerts (batch 2): subscription storage.
[[d1_databases]]
binding = "DB"
database_name = "saffara-push"
database_id = "00a7168c-b368-49cf-9851-cefad7adefb3"
migrations_dir = "migrations"
