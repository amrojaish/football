<head>

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Segoe UI",Tahoma,sans-serif; background:#0f1419;
         color:#e8eaed; padding:24px 16px; line-height:1.6; }
  .wrap { max-width:900px; margin:0 auto; }
  .topbar { display:flex; align-items:center;
            justify-content:space-between; margin-bottom:14px; }
  .back { display:inline-block; color:#2f81f7; text-decoration:none;
          font-size:14px; }
  .back:hover { text-decoration:underline; }
  .lang { background:#161b22; color:#7d8590; border:1px solid #21262d;
          padding:6px 14px; border-radius:8px; font-size:13px;
          text-decoration:none; font-family:inherit; }
  .lang:hover { background:#1c2128; color:#e8eaed; }
  .club-head { display:flex; align-items:center; gap:16px;
               background:#161b22; border-radius:12px;
               padding:20px; margin-bottom:8px; }
  .club-head img { width:64px; height:64px; object-fit:contain; }
  .club-head h1 { font-size:24px; }
  .club-head .sub { color:#7d8590; font-size:13px; margin-top:2px; }
  h2 { font-size:17px; margin:28px 0 12px; padding-inline-start:10px;
       border-inline-start:3px solid #2f81f7; }
  h3 { font-size:14px; color:#7d8590; margin:18px 0 8px;
       font-weight:normal; }
  .summary { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .stat { background:#161b22; border-radius:9px; padding:10px 14px;
          text-align:center; min-width:64px; flex:1; }
  .stat .n { font-size:19px; font-weight:700; }
  .stat .l { font-size:11px; color:#7d8590; }
  .stat.hi .n { color:#2f81f7; }
  .stat.click { cursor:pointer; transition:.15s; }
  .stat.click:hover { background:#1c2128; }
  .stat.act { background:#2f81f7; }
  .stat.act .n, .stat.act .l { color:#fff; }
  .match { background:#161b22; border-radius:10px; padding:12px;
           margin-bottom:7px; display:grid;
           grid-template-columns:1fr auto 1fr; align-items:center; gap:10px; }
  .match.filt { display:none; }
  .side { display:flex; align-items:center; gap:8px; font-size:14px;
          min-width:0; }
  .side.away { justify-content:flex-end; }
  a.side { text-decoration:none; color:#e8eaed; }
  a.side:hover span { color:#2f81f7; }
  .side img { width:24px; height:24px; object-fit:contain; }
  .side span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .score { font-size:17px; font-weight:700; padding:4px 12px;
           background:#0d1117; border-radius:6px; white-space:nowrap; }
  .date { grid-column:1/-1; text-align:center; color:#7d8590;
          font-size:11px; margin-top:4px; }
  .date a { color:#7d8590; text-decoration:none; }
  .date a:hover { color:#2f81f7; }
  .rw { border-inline-start:3px solid #3fb950; }
  .rd { border-inline-start:3px solid #7d8590; }
  .rl { border-inline-start:3px solid #f85149; }
  ol { list-style:none; background:#161b22; border-radius:10px; padding:6px; }
  ol li { display:flex; align-items:center; gap:12px; padding:9px 12px;
          border-bottom:1px solid #21262d; font-size:14px; }
  ol li:last-child { border-bottom:none; }
  ol li.hidden { display:none; }
  .num { color:#7d8590; width:20px; }
  .pname { flex:1; min-width:0; overflow:hidden;
           text-overflow:ellipsis; white-space:nowrap; }
  .pgoals { font-weight:700; color:#2f81f7; min-width:22px;
            text-align:end; }
  .more { display:block; width:100%; margin:6px 0 14px;
          background:#161b22; color:#2f81f7; border:1px solid #21262d;
          padding:11px; border-radius:9px; cursor:pointer;
          font-family:inherit; font-size:14px; }
  .more:hover { background:#1c2128; }
  .hidden { display:none; }
  .stabs { display:flex; gap:8px; flex-wrap:wrap; margin:18px 0 4px; }
  .stab { background:#161b22; color:#7d8590; border:1px solid #21262d;
          padding:8px 16px; border-radius:8px; cursor:pointer;
          font-family:inherit; font-size:14px; }
  .stab:hover { background:#1c2128; color:#e8eaed; }
  .stab.active { background:#238636; color:#fff; border-color:#238636; }
  .spanel { display:none; }
  .spanel.on { display:block; }
  footer { text-align:center; color:#7d8590; font-size:12px;
           margin-top:36px; line-height:1.9; }
</style>
</head>
<body>
<div class="wrap">
<div class="topbar"><a class="back" href="../index.html">→ رجوع للصفحة الرئيسية</a><a class="lang" href="../en/clubs/2951.html">EN</a></div>
<div class="club-head"><img src="https://media.api-sports.io/football/teams/2951.png" alt=""><div><h1>نادي أبها</h1><div class="sub">Abha</div></div></div>
<div class="stabs"><button class="stab" data-k="SAU_2026">الدوري السعودي 2026-2027</button></div><section class="spanel" id="s_SAU_2026"><h2>الدوري السعودي — موسم 2026-2027</h2><div class="summary"><div class="stat hi"><div class="n">4</div><div class="l">المركز</div></div><div class="stat hi"><div class="n">0</div><div class="l">نقاط</div></div><div class="stat"><div class="n">1</div><div class="l">لعب</div></div><div class="stat click" data-f="rw"><div class="n">0</div><div class="l">فاز</div></div><div class="stat click" data-f="rd"><div class="n">0</div><div class="l">تعادل</div></div><div class="stat click" data-f="rl"><div class="n">1</div><div class="l">خسر</div></div><div class="stat"><div class="n">1</div><div class="l">له</div></div><div class="stat"><div class="n">2</div><div class="l">عليه</div></div></div><h3>كل المباريات</h3><div class="mbox"><div class="match rl" data-m="1"><a class="side" href="2951.html"><img src="https://media.api-sports.io/football/teams/2951.png" alt=""><span>أبها</span></a><div class="score">1 - 2</div><a class="side away" href="2945.html"><span>الحزم</span><img src="https://media.api-sports.io/football/teams/2945.png" alt=""></a><div class="date"><a href="../matches/1602972.html">2026-08-13 ←</a></div></div></div><h3>هدافو النادي</h3><ol><li class=""><span class="num">1</span><span class="pname">M. Al Dawsari</span><span class="pgoals">1</span></li></ol></section>
<footer>الأسماء والشعارات المصححة من إعداد المطوّر<br>البيانات الأساسية من API-Football</footer>
</div>
<script>
const T=document.querySelectorAll(".stab");
const P=document.querySelectorAll(".spanel");
function go(k){P.forEach(p=>p.classList.toggle("on",p.id==="s_"+k));
T.forEach(t=>t.classList.toggle("active",t.dataset.k===k));}
T.forEach(t=>t.addEventListener("click",function(){go(this.dataset.k);}));
if(T.length)go(T[0].dataset.k);
var SA="▼ عرض الكل",SL="▲ عرض أقل";
document.querySelectorAll(".more").forEach(function(b){
b.dataset.open="0";
b.addEventListener("click",function(){
var box=this.previousElementSibling;
var kids=box.children;
var lim=box.tagName==="OL"?5:3;
var op=this.dataset.open==="1";
var vis=[];
for(var i=0;i<kids.length;i++){
if(!kids[i].classList.contains("filt")){vis.push(kids[i]);}}
var lm=box.tagName==="OL"?5:(vis.length<kids.length?5:lim);
vis.forEach(function(m,j){
if(j>=lm){m.classList.toggle("hidden",op);}});
this.dataset.open=op?"0":"1";
this.textContent=(op?SA:SL)+" ("+vis.length+")";
});});
document.querySelectorAll(".stat.click").forEach(function(s){
s.addEventListener("click",function(){
var p=this.closest(".spanel");
var f=this.dataset.f;
var was=this.classList.contains("act");
p.querySelectorAll(".stat.click").forEach(function(x){
x.classList.remove("act");});
var box=p.querySelector(".mbox");
var btn=p.querySelector(".mbox+.more");
if(was){
box.querySelectorAll(".match").forEach(function(m,i){
m.classList.remove("filt");
m.classList.toggle("hidden",i>=3);});
if(btn){btn.style.display="";btn.dataset.open="0";
btn.textContent=SA+" ("+box.children.length+")";}
return;}
this.classList.add("act");
var k=0;
box.querySelectorAll(".match").forEach(function(m){
var ok=m.classList.contains(f);
m.classList.toggle("filt",!ok);
if(ok){k++;m.classList.toggle("hidden",k>5);}
else{m.classList.remove("hidden");}});
if(btn){if(k>5){btn.style.display="";btn.dataset.open="0";
btn.textContent=SA+" ("+k+")";}
else{btn.style.display="none";}}
});});
</script>
</body>
</html>
