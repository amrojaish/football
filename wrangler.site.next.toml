# R3 (prepared 14 Nov 2026, NOT live yet): saffara-site with page .html in R2. Replaces wrangler.site.toml at switch time.
# Static assets = _hot (build_site.py --split-hot _hot: every non-.html file + the 12 HOT_HTML shell pages);
# every other .html comes from R2 bucket saffara-pages (binding PAGES), uploaded by upload_changed.py --apply
# BEFORE this deploy. site_worker.js serves R2 pages; without PAGES it falls back to the pre-R3 behaviour.
#   python build_site.py --out _site --max-mb 2000 --split-hot _hot
#   python upload_changed.py --apply
#   npx wrangler deploy --config wrangler.site.next.toml
name = "saffara-site"
main = "site_worker.js"
compatibility_date = "2026-09-02"
compatibility_flags = ["assets_navigation_has_no_effect"]
workers_dev = true
preview_urls = false
routes = [{ pattern = "saffara.app", custom_domain = true }]

[assets]
directory = "_hot"
binding = "ASSETS"
run_worker_first = false
html_handling = "none"
not_found_handling = "404-page"

[[r2_buckets]]
binding = "PAGES"
bucket_name = "saffara-pages"
