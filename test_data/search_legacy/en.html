  // (25 أكتوبر 2026، دفعة UI 3) كان يختفي بلا تاريخ (صفحة فُتحت من إشعار/رابط خارجي = لا رجوع إطلاقاً) ويعيد زائر

<script>
(function(){
  var ns=document.getElementById('navsearch');
  // اختصار "/" يفتح صفحة البحث (كان يفتح النافذة)
  document.addEventListener('keydown',function(e){
    if(e.key==='/' && ns && !/^(INPUT|TEXTAREA)$/.test(
        document.activeElement.tagName)){
      e.preventDefault(); location.href=ns.href;
    }
  });

  var so=document.getElementById('sovl2');
  var sb=document.getElementById('navset');
  var sc=document.getElementById('sclose2');

  // تلوين الأيقونة النشطة — الرابط الافتراضي يبقى ملوّناً
  // عند إغلاق النافذة
  function navOn(el){
    document.querySelectorAll('.nav a,.nav button')
      .forEach(function(x){
        x.classList.remove('on');
        x.querySelectorAll('.ic,span').forEach(function(s){
          s.classList.remove('on');});
      });
    if(el){el.classList.add('on');
      el.querySelectorAll('.ic,span').forEach(function(s){
        s.classList.add('on');});}
  }
  var defaultOn=document.querySelector('.nav a.on');
  function navReset(){navOn(defaultOn);}
  window.__navOn=navOn;
  window.__navReset=navReset;

  // ⚠️ "الدوريات" صار صفحة مستقلة (leagues.html) لا مرساة —
  //    فالتلوين يأتي من active عند التوليد، ولا حاجة لمراقبة
  //    التمرير التي كانت ضرورية حين كان القسم داخل الرئيسية.


  if(sb&&so){sb.addEventListener('click',function(){
    so.classList.add('on');navOn(sb);});}
  if(sc&&so){sc.addEventListener('click',function(){
    so.classList.remove('on');navReset();});}
  if(so){so.addEventListener('click',function(e){
    if(e.target===so){so.classList.remove('on');navReset();}});}

  // أزرار الوضع — تطابق منطق theme.py حرفياً:
  // المفتاح "theme"، والداكن = إزالة السمة لا قيمة "dark"
  function setTheme(light){
    var h=document.documentElement;
    if(light){h.setAttribute('data-theme','light');}
    else{h.removeAttribute('data-theme');}
    try{localStorage.setItem('theme',light?'light':'dark');}catch(e){}
    mark();
  }
  function mark(){
    var light=document.documentElement
              .getAttribute('data-theme')==='light';
    var d=document.getElementById('thdark');
    var l=document.getElementById('thlight');
    if(d)d.classList.toggle('act',!light);
    if(l)l.classList.toggle('act',light);
  }
  var d=document.getElementById('thdark');
  var l=document.getElementById('thlight');
  if(d)d.addEventListener('click',function(){setTheme(false);});
  if(l)l.addEventListener('click',function(){setTheme(true);});
  mark();
})();

    wrap.style.overflowX='clip';
    // المجاورة تُعرض من أعلى الجزء المرئي من اللوحة الحالية (تحت الشريط الثابت إن وُجد)، وتُثبَّت هناك بعد الإنهاء
    var inset=Math.max(0,S.bar.getBoundingClientRect().bottom), top=cur.getBoundingClientRect().top;
    g.delta=Math.max(0,inset-top);
    g.off=(g.sign<0?1:-1)*(g.W+GAP);
    nb.style.display='block'; nb.style.position='absolute'; nb.style.top=(cur.offsetTop+g.delta)+'px';
    nb.style.left=cur.offsetLeft+'px'; nb.style.width=g.W+'px';
    cur.style.willChange=nb.style.willChange='transform';
    tr(nb,g.off,false);
    if(S.s.ind){
      // مواضع الزرّين تُقرأ مرة واحدة هنا: قراءتها بعد كل كتابة transform تفرض إعادة تخطيط الصفحة كلها بكل حركة (بطء على اللوحات الكبيرة)
      var ta=S.tabs[S.cur], tb=S.tabs[n]; g.ix=[ta.offsetLeft,ta.offsetWidth,tb.offsetLeft,tb.offsetWidth];
      if(getComputedStyle(S.bar).position==='static')S.bar.style.position='relative';
      g.ind=D.createElement('span'); g.ind.className='swind'; S.bar.appendChild(g.ind); S.bar.classList.add('swdrag');
    }
  }
  function indAt(p){
    if(!g.ind)return;
    var x=g.ix, l=x[0]+(x[2]-x[0])*p, w=x[1]+(x[3]-x[1])*p;
    g.ind.style.left=l+'px'; g.ind.style.width=w+'px';
  }
  function moveTab(dx){
    if(g.rm)return;
    tr(g.set.panel,dx,false); tr(g.nb,g.off+dx,false);
    indAt(Math.min(1,Math.abs(dx)/(g.W+GAP)));
  }
  function endTab(go){
    var G=g, S=G.set, cur=S.panel, nb=G.nb, fin=go?-G.off:0;
    if(G.rm){if(go)S.tabs[G.n].click(); g=null; return;}   // فوراً، بلا انتقال
    G.anim=true;
    tr(cur,fin,true); tr(nb,G.off+fin,true);
    if(G.ind){G.ind.style.transition=DUR?'left '+DUR+'ms ease-out, width '+DUR+'ms ease-out':'none';indAt(go?1:0);}
    setTimeout(function(){
      restore(cur,G.sv.cur); restore(nb,G.sv.nb); restore(G.wrap,G.sv.wrap); restore(S.bar,G.sv.bar);
      if(G.ind){G.ind.remove(); S.bar.classList.remove('swdrag');}
      if(go){
        var y0=window.pageYOffset;
        S.tabs[G.n].click();   // منطق الصفحة نفسه (لوحات كسولة، history، تمرير)
        if(G.delta>0&&window.pageYOffset===y0)window.scrollBy(0,-G.delta);
      }
      if(g===G)g=null;
    },DUR+20);
  }

})();
</script></body>
